<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamHub - Premium Game Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #ff6b9d;
            --accent: #ffd93d;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #151528 50%, #1a1a3e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0.15;
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 20s infinite ease-in-out;
        }

        .bg-animation::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            opacity: 0.1;
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 25s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-top: 20px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 3rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--text-secondary);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Search Section */
        .search-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px 20px 20px 55px;
            font-size: 1.1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 20px 40px;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .search-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-right: 10px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
        }

        /* Quick Tags */
        .quick-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .quick-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-tag:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stats-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .stats-text span {
            color: var(--primary);
            font-weight: 600;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .view-btn {
            background: transparent;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: rgba(0, 212, 255, 0.2);
            color: var(--primary);
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            cursor: pointer;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-image-container {
            position: relative;
            height: 180px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a3e 0%, #0f0f23 100%);
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover .game-image {
            transform: scale(1.1);
        }

        .game-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-secondary);
            background: linear-gradient(135deg, #1a1a3e 0%, #0f0f23 100%);
        }

        .game-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-badge.verified {
            color: var(--success);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .game-badge.unverified {
            color: var(--warning);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .game-content {
            padding: 25px;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .game-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-meta-item i {
            font-size: 0.85rem;
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .game-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .game-price {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .game-price.free {
            color: var(--success);
        }

        .game-price.paid {
            color: var(--accent);
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary), #0099cc);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, var(--secondary), #ff477e);
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        /* List View Card */
        .game-card.list-view {
            display: flex;
            height: 140px;
        }

        .game-card.list-view .game-image-container {
            width: 200px;
            height: 100%;
            flex-shrink: 0;
        }

        .game-card.list-view .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-card.list-view .game-title {
            -webkit-line-clamp: 1;
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            height: 380px;
        }

        .skeleton-image {
            height: 180px;
            width: 100%;
        }

        .skeleton-content {
            padding: 25px;
        }

        .skeleton-title {
            height: 24px;
            width: 80%;
            margin-bottom: 15px;
        }

        .skeleton-meta {
            height: 16px;
            width: 60%;
            margin-bottom: 20px;
        }

        .skeleton-button {
            height: 45px;
            width: 100%;
            border-radius: 12px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: linear-gradient(135deg, #151528 0%, #1a1a3e 100%);
            border: 1px solid var(--border);
            border-radius: 30px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .modal-header {
            position: relative;
            height: 300px;
            overflow: hidden;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-header-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to top, #151528 0%, transparent 100%);
        }

        .modal-content {
            padding: 40px;
            margin-top: -50px;
            position: relative;
            z-index: 1;
        }

        .modal-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-meta {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .modal-meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        .modal-meta-item i {
            color: var(--primary);
        }

        .modal-description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
        }

        .modal-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            font-size: 1.5rem;
        }

        .toast-icon.success { color: var(--success); }
        .toast-icon.error { color: var(--danger); }
        .toast-icon.info { color: var(--primary); }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .toast-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .search-container {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .game-card.list-view {
                flex-direction: column;
                height: auto;
            }

            .game-card.list-view .game-image-container {
                width: 100%;
                height: 200px;
            }

            .modal-header {
                height: 200px;
            }

            .modal-title {
                font-size: 1.8rem;
            }

            .modal-content {
                padding: 25px;
            }

            .toast-container {
                left: 20px;
                right: 20px;
                bottom: 20px;
            }

            .toast {
                max-width: 100%;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--secondary), var(--accent));
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <i class="fas fa-gamepad logo-icon"></i>
                <h1 class="logo">SteamHub</h1>
            </div>
            <p class="subtitle">Explore and discover your next favorite game from the world's largest gaming platform</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search games like Elden Ring, CS2, GTA V, Valorant...">
                </div>
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </button>
            </div>

            <div class="filters">
                <span class="filter-label"><i class="fas fa-filter"></i> Filter:</span>
                <button class="filter-btn active" data-filter="all">All Games</button>
                <button class="filter-btn" data-filter="free">Free to Play</button>
                <button class="filter-btn" data-filter="verified">Verified</button>
                <button class="filter-btn" data-filter="discount">On Sale</button>
            </div>

            <div class="quick-tags">
                <span style="color: var(--text-secondary); font-size: 0.9rem;"><i class="fas fa-fire"></i> Trending:</span>
                <span class="quick-tag" data-query="counter-strike"><i class="fas fa-crosshairs"></i> CS2</span>
                <span class="quick-tag" data-query="dota 2"><i class="fas fa-chess-board"></i> Dota 2</span>
                <span class="quick-tag" data-query="gta"><i class="fas fa-car"></i> GTA</span>
                <span class="quick-tag" data-query="apex"><i class="fas fa-fire-alt"></i> Apex</span>
                <span class="quick-tag" data-query="valorant"><i class="fas fa-shield-alt"></i> Valorant</span>
                <span class="quick-tag" data-query="minecraft"><i class="fas fa-cube"></i> Minecraft</span>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stats-text">
                Showing <span id="resultCount">0</span> games
            </div>
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" title="Grid View">
                    <i class="fas fa-th-large"></i>
                </button>
                <button class="view-btn" data-view="list" title="List View">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>

        <!-- Games Container -->
        <div class="games-grid" id="gamesGrid"></div>
        <div class="games-list" id="gamesList" style="display: none;"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>No games found</h3>
            <p>Try adjusting your search or filters to find what you're looking for.</p>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-header">
                <img class="modal-image" id="modalImage" src="" alt="">
                <div class="modal-header-overlay"></div>
            </div>
            <div class="modal-content">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta">
                    <div class="modal-meta-item">
                        <i class="fas fa-tag"></i>
                        <span id="modalAppId"></span>
                    </div>
                    <div class="modal-meta-item">
                        <i class="fas fa-check-circle"></i>
                        <span id="modalStatus"></span>
                    </div>
                    <div class="modal-meta-item">
                        <i class="fas fa-calendar"></i>
                        <span id="modalDate"></span>
                    </div>
                    <div class="modal-meta-item">
                        <i class="fas fa-dollar-sign"></i>
                        <span id="modalPrice"></span>
                    </div>
                </div>
                <p class="modal-description" id="modalDescription"></p>
                <div class="modal-actions">
                    <button class="modal-btn primary" id="modalDownload">
                        <i class="fas fa-download"></i>
                        Download Now
                    </button>
                    <button class="modal-btn secondary" id="modalSteam">
                        <i class="fab fa-steam"></i>
                        View on Steam
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // State Management
        const state = {
            games: [],
            filteredGames: [],
            currentFilter: 'all',
            currentView: 'grid',
            loading: false,
            selectedGame: null
        };

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const gamesGrid = document.getElementById('gamesGrid');
        const gamesList = document.getElementById('gamesList');
        const emptyState = document.getElementById('emptyState');
        const resultCount = document.getElementById('resultCount');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modalClose');
        const toastContainer = document.getElementById('toastContainer');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            searchGames('counter-strike');
            setupEventListeners();
        });

        // Event Listeners
        function setupEventListeners() {
            // Search
            searchBtn.addEventListener('click', () => performSearch());
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });

            // Quick Tags
            document.querySelectorAll('.quick-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    searchInput.value = tag.dataset.query;
                    performSearch();
                });
            });

            // Filters
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentFilter = btn.dataset.filter;
                    filterGames();
                });
            });

            // View Toggle
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentView = btn.dataset.view;
                    toggleView();
                });
            });

            // Modal
            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Modal Actions
            document.getElementById('modalDownload').addEventListener('click', () => {
                if (state.selectedGame) {
                    downloadGame(state.selectedGame.appId);
                    closeModal();
                }
            });

            document.getElementById('modalSteam').addEventListener('click', () => {
                if (state.selectedGame) {
                    window.open(`https://store.steampowered.com/app/${state.selectedGame.appId}`, '_blank');
                }
            });
        }

        // Search Functionality
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                showToast('Please enter a search term', 'error');
                return;
            }
            await searchGames(query);
        }

        async function searchGames(query) {
            try {
                setLoading(true);
                state.loading = true;

                // API 1: Search games (ORIGINAL - tidak diubah)
                const response = await fetch(`https://steam-search.vercel.app/api/games?search=${encodeURIComponent(query)}`);
                const games = await response.json();

                if (games && games.length > 0) {
                    // Enhance game data with additional APIs
                    const enhancedGames = await Promise.all(
                        games.slice(0, 12).map(async (game) => {
                            const appId = game.appid || game.id;

                            // API 2: Get Steam header image (TAMBAHAN)
                            const headerImage = `https://cdn.akamai.steamstatic.com/steam/apps/${appId}/header.jpg`;

                            // API 3: Get Steam app details (TAMBAHAN)
                            const steamDetails = await fetchSteamDetails(appId);

                            // API 4: Verify from GitHub (ORIGINAL - tidak diubah)
                            const verifyData = await verifyGame(appId);

                            return {
                                ...game,
                                appId,
                                headerImage,
                                ...steamDetails,
                                ...verifyData
                            };
                        })
                    );

                    state.games = enhancedGames;
                    filterGames();
                    showToast(`Found ${enhancedGames.length} games`, 'success');
                } else {
                    state.games = [];
                    renderEmpty();
                    showToast('No games found', 'info');
                }
            } catch (error) {
                console.error('Search error:', error);
                showToast('Failed to search games', 'error');
                renderEmpty();
            } finally {
                setLoading(false);
                state.loading = false;
            }
        }

        // Fetch Steam Details (API TAMBAHAN)
        async function fetchSteamDetails(appId) {
            try {
                const response = await fetch(`https://store.steampowered.com/api/appdetails?appids=${appId}`);
                const data = await response.json();
                const gameData = data[appId]?.data;

                if (gameData) {
                    return {
                        name: gameData.name, // Judul yang benar dari Steam
                        description: gameData.short_description || 'No description available',
                        detailedDescription: gameData.detailed_description || '',
                        aboutTheGame: gameData.about_the_game || '',
                        price: gameData.is_free ? 'Free to Play' : (gameData.price_overview?.final_formatted || 'N/A'),
                        originalPrice: gameData.price_overview?.initial_formatted || null,
                        discount: gameData.price_overview?.discount_percent || 0,
                        genres: gameData.genres?.slice(0, 3).map(g => g.description) || [],
                        categories: gameData.categories?.slice(0, 3).map(c => c.description) || [],
                        releaseDate: gameData.release_date?.date || 'Unknown',
                        comingSoon: gameData.release_date?.coming_soon || false,
                        developers: gameData.developers || ['Unknown'],
                        publishers: gameData.publishers || ['Unknown'],
                        platforms: gameData.platforms || {},
                        metacritic: gameData.metacritic?.score || null,
                        recommendations: gameData.recommendations?.total || 0,
                        isFree: gameData.is_free,
                        type: gameData.type
                    };
                }
            } catch (error) {
                console.error('Steam details API error:', error);
            }

            return {
                name: null,
                description: 'No description available',
                detailedDescription: '',
                aboutTheGame: '',
                price: 'N/A',
                originalPrice: null,
                discount: 0,
                genres: [],
                categories: [],
                releaseDate: 'Unknown',
                comingSoon: false,
                developers: ['Unknown'],
                publishers: ['Unknown'],
                platforms: {},
                metacritic: null,
                recommendations: 0,
                isFree: false,
                type: 'game'
            };
        }

        // Verify Game (API ORIGINAL - tidak diubah)
        async function verifyGame(appId) {
            try {
                const response = await fetch(`https://api.github.com/repos/8782hei-sketch/ManifestHub-V2/branches/${appId}`);
                const data = await response.json();
                return {
                    isVerified: response.ok,
                    lastUpdate: data.commit?.commit?.author?.date || 'Unknown',
                    commitSha: data.commit?.sha?.substring(0, 7) || 'Unknown'
                };
            } catch (error) {
                return {
                    isVerified: false,
                    lastUpdate: 'Unknown',
                    commitSha: 'Unknown'
                };
            }
        }

        // Filter Games
        function filterGames() {
            let filtered = [...state.games];

            switch (state.currentFilter) {
                case 'free':
                    filtered = filtered.filter(g => g.isFree);
                    break;
                case 'verified':
                    filtered = filtered.filter(g => g.isVerified);
                    break;
                case 'discount':
                    filtered = filtered.filter(g => g.discount > 0);
                    break;
            }

            state.filteredGames = filtered;
            renderGames();
        }

        // Toggle View
        function toggleView() {
            if (state.currentView === 'grid') {
                gamesGrid.style.display = 'grid';
                gamesList.style.display = 'none';
            } else {
                gamesGrid.style.display = 'none';
                gamesList.style.display = 'flex';
            }
            renderGames();
        }

        // Render Games
        function renderGames() {
            resultCount.textContent = state.filteredGames.length;

            if (state.filteredGames.length === 0) {
                renderEmpty();
                return;
            }

            emptyState.style.display = 'none';
            const container = state.currentView === 'grid' ? gamesGrid : gamesList;
            container.innerHTML = '';

            state.filteredGames.forEach((game, index) => {
                const card = createGameCard(game, index);
                container.appendChild(card);
            });
        }

        // Create Game Card
        function createGameCard(game, index) {
            const card = document.createElement('div');
            card.className = `game-card ${state.currentView === 'list' ? 'list-view' : ''}`;
            card.style.animationDelay = `${index * 0.1}s`;

            // Gunakan nama dari Steam API jika tersedia, fallback ke nama dari search API
            const displayName = game.name || game.name || 'Unknown Game';

            const priceClass = game.isFree ? 'free' : 'paid';
            const verifiedBadge = game.isVerified 
                ? `<span class="game-badge verified"><i class="fas fa-check-circle"></i> Verified</span>`
                : `<span class="game-badge unverified"><i class="fas fa-exclamation-triangle"></i> Unverified</span>`;

            // Gunakan header image dari Steam CDN
            const imageHtml = `<img class="game-image" src="${game.headerImage}" alt="${displayName}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'game-image-placeholder\'><i class=\'fas fa-gamepad\'></i></div>'">`;

            const tagsHtml = game.genres?.length > 0 
                ? `<div class="game-tags">${game.genres.map(g => `<span class="game-tag">${g}</span>`).join('')}</div>`
                : '';

            // Format harga dengan discount jika ada
            let priceDisplay = game.price;
            if (game.discount > 0) {
                priceDisplay = `<span style="text-decoration: line-through; opacity: 0.6;">${game.originalPrice}</span> ${game.price}`;
            }

            card.innerHTML = `
                <div class="game-image-container">
                    ${imageHtml}
                    ${verifiedBadge}
                </div>
                <div class="game-content">
                    <h3 class="game-title">${displayName}</h3>
                    <div class="game-meta">
                        <span class="game-meta-item"><i class="fas fa-code"></i> ${game.developers[0]}</span>
                        <span class="game-meta-item"><i class="fas fa-calendar"></i> ${game.releaseDate}</span>
                        ${game.metacritic ? `<span class="game-meta-item" style="color: var(--accent);"><i class="fas fa-star"></i> ${game.metacritic}</span>` : ''}
                    </div>
                    ${tagsHtml}
                    <div class="game-footer">
                        <span class="game-price ${priceClass}">${priceDisplay}</span>
                        <button class="download-btn" onclick="event.stopPropagation(); downloadGame(${game.appId})">
                            <i class="fas fa-download"></i> Get
                        </button>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openModal(game));
            return card;
        }

        // Render Empty State
        function renderEmpty() {
            gamesGrid.innerHTML = '';
            gamesList.innerHTML = '';
            emptyState.style.display = 'block';
            resultCount.textContent = '0';
        }

        // Render Skeleton Loading
        function renderSkeleton() {
            const container = state.currentView === 'grid' ? gamesGrid : gamesList;
            container.innerHTML = '';
            emptyState.style.display = 'none';

            for (let i = 0; i < 6; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-card';
                skeleton.innerHTML = `
                    <div class="skeleton skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-meta"></div>
                        <div class="skeleton skeleton-button"></div>
                    </div>
                `;
                container.appendChild(skeleton);
            }
        }

        // Set Loading State
        function setLoading(loading) {
            if (loading) {
                searchBtn.classList.add('loading');
                searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
                renderSkeleton();
            } else {
                searchBtn.classList.remove('loading');
                searchBtn.innerHTML = '<i class="fas fa-search"></i> <span>Search</span>';
            }
        }

        // Open Modal
        function openModal(game) {
            state.selectedGame = game;

            // Gunakan nama dari Steam API
            const displayName = game.name || game.name || 'Unknown Game';

            document.getElementById('modalTitle').textContent = displayName;
            document.getElementById('modalAppId').textContent = `App ID: ${game.appId}`;
            document.getElementById('modalStatus').textContent = game.isVerified ? 'Verified Crack Available' : 'Unverified Source';
            document.getElementById('modalStatus').style.color = game.isVerified ? 'var(--success)' : 'var(--warning)';
            document.getElementById('modalDate').textContent = `Updated: ${new Date(game.lastUpdate).toLocaleDateString()}`;
            document.getElementById('modalPrice').textContent = game.price;
            document.getElementById('modalDescription').textContent = game.detailedDescription || game.description || 'No description available.';
            document.getElementById('modalImage').src = game.headerImage;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close Modal
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            state.selectedGame = null;
        }

        // Download Game (API ORIGINAL - tidak diubah)
        function downloadGame(appId) {
            const downloadUrl = `https://codeload.github.com/8782hei-sketch/ManifestHub-V2/zip/refs/heads/${appId}`;
            window.open(downloadUrl, '_blank');
            showToast('Download started!', 'success');
        }

        // Show Toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            toast.innerHTML = `
                <i class="fas ${icons[type]} toast-icon ${type}"></i>
                <div class="toast-content">
                    <div class="toast-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;

            toastContainer.appendChild(toast);

            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);

            // Remove after delay
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>
</html>
